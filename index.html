<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11101b">
  <meta name="description" content="Mongil Database: base de datos de personajes, artefactos, monsterlings y equipamiento de Mongil: Star Dive.">
  <title>Mongil Database</title>
  <style>
    :root{color-scheme:dark;--bg:#11101b;--panel:#1b1929;--panel2:#242136;--line:#37324c;--text:#f5f1ff;--muted:#aaa3bd;--accent:#c7a7ff;--gold:#f3cf85;--good:#9fe0bd;--warn:#f3cf85}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#382b58 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{padding:42px 0 26px;border-bottom:1px solid var(--line)}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(32px,6vw,54px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.04em}
    .sub{color:var(--muted);max-width:650px;margin:0}.status{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.dot.live{background:var(--good)}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:24px 0}
    .stat,.panel{background:linear-gradient(145deg,var(--panel),#171523);border:1px solid var(--line);border-radius:16px}
    .stat{padding:16px}.stat strong{display:block;font-size:27px;letter-spacing:-.04em}.stat span{color:var(--muted);font-size:12px}
    .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0 16px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:10px;cursor:pointer;font:inherit}
    .tab[aria-pressed=true]{background:#382b58;border-color:#8163ad;color:white}
    input{width:min(320px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--text);font:inherit}
    .panel{overflow:hidden;margin-bottom:42px}.panelhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
    h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:12px}
    .tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #2b273b;vertical-align:top;max-width:420px;overflow-wrap:anywhere}
    th{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:#211e30}td{color:#e8e2f4;font-size:13px}tr:last-child td{border-bottom:0}
    .empty{padding:30px 20px;color:var(--muted);text-align:center}.error{color:#ffb4b4}
    footer{padding:20px 0 34px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
    @media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child{grid-column:span 2}.top{padding-top:30px}.panelhead{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <div class="eyebrow">Mongil · Star Dive</div>
    <h1>Mongil Database</h1>
    <p class="sub">Una base de datos organizada para consultar personajes, artefactos, monsterlings, equipamientos y regiones.</p>
    <div class="status" id="status"><span class="dot"></span><span>Conectando con la base de datos…</span></div>
  </div></header>
  <main class="wrap">
    <section class="stats" id="stats" aria-label="Resumen de registros"></section>
    <div class="toolbar">
      <nav class="tabs" id="tabs" aria-label="Categorías"></nav>
      <input id="search" type="search" placeholder="Buscar en esta categoría…" aria-label="Buscar">
    </div>
    <section class="panel">
      <div class="panelhead"><h2 id="sectionTitle">Personajes</h2><span class="count" id="resultCount"></span></div>
      <div id="content"><div class="empty">Cargando registros…</div></div>
    </section>
  </main>
  <footer><div class="wrap">Mongil Database · Los datos se cargan desde <code>data/mongil_database.json</code>.</div></footer>
<script>
(() => {
  const categories = [
    {key:'personajes',label:'Personajes'},
    {key:'artefactos',label:'Artefactos'},
    {key:'monsterlings',label:'Monsterlings'},
    {key:'conjuntos',label:'Equipamiento'},
    {key:'regiones',label:'Regiones'}
  ];
  let database = {};
  let active = 'personajes';
  const $ = id => document.getElementById(id);
  const safe = value => {
    if (value === null || value === undefined || value === '') return '—';
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
  };
  const recordsFor = key => Array.isArray(database[key]) ? database[key] : [];
  function renderStats() {
    $('stats').innerHTML = categories.map(c =>
      '<div class="stat"><strong>' + recordsFor(c.key).length + '</strong><span>' + c.label + '</span></div>'
    ).join('');
  }
  function renderTabs() {
    $('tabs').innerHTML = categories.map(c =>
      '<button class="tab" type="button" data-key="' + c.key + '" aria-pressed="' + (active === c.key) + '">' + c.label + '</button>'
    ).join('');
    $('tabs').querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
      active = button.dataset.key; renderTabs(); renderTable();
    }));
  }
  function renderTable() {
    const category = categories.find(c => c.key === active);
    $('sectionTitle').textContent = category ? category.label : 'Registros';
    const query = $('search').value.trim().toLocaleLowerCase('es');
    const rows = recordsFor(active).filter(row => JSON.stringify(row).toLocaleLowerCase('es').includes(query));
    $('resultCount').textContent = rows.length + (rows.length === 1 ? ' registro' : ' registros');
    if (!rows.length) {
      $('content').innerHTML = '<div class="empty">' + (recordsFor(active).length ? 'No hay resultados para esa búsqueda.' : 'Todavía no hay registros publicados en esta categoría.') + '</div>';
      return;
    }
    const keys = [...new Set(rows.flatMap(row => row && typeof row === 'object' ? Object.keys(row) : ['valor']))];
    const head = keys.map(k => '<th>' + escapeHtml(k.replaceAll('_',' ')) + '</th>').join('');
    const body = rows.map(row => '<tr>' + keys.map(k => '<td>' + escapeHtml(safe(row && typeof row === 'object' ? row[k] : row)) + '</td>').join('') + '</tr>').join('');
    $('content').innerHTML = '<div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  $('search').addEventListener('input', renderTable);
  fetch('./data/mongil_database.json', {cache:'no-store'})
    .then(response => { if (!response.ok) throw new Error('HTTP ' + response.status); return response.json(); })
    .then(data => {
      database = data || {};
      renderStats(); renderTabs(); renderTable();
      const provisional = database.estado === 'provisional' || database.provisional === true;
      $('status').innerHTML = '<span class="dot ' + (provisional ? '' : 'live') + '"></span><span>' +
        (provisional ? 'Estructura inicial · esperando los datos reales de Google Sheets' : 'Datos cargados correctamente') + '</span>';
    })
    .catch(error => {
      $('status').innerHTML = '<span class="dot"></span><span class="error">No se pudo cargar el JSON: ' + escapeHtml(error.message) + '</span>';
      $('stats').innerHTML = ''; $('content').innerHTML = '<div class="empty error">Revisa que exista data/mongil_database.json y que contenga JSON válido.</div>';
    });
})();
</script>
</body>
</html>
